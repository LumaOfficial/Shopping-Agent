<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Savings</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="sidepanel">
    <header class="bar">
      <div class="brand">Savings <span id="store-name"></span></div>
      <a class="icon-link" href="options.html" target="_blank" title="Settings">⚙</a>
    </header>

    <div class="panel-body">
      <section class="block" id="empty" hidden>
        <p class="muted" id="empty-text">Open a supported store to see savings.</p>
      </section>

      <section class="block" id="cashback-block" hidden>
        <div class="label">Cashback</div>
        <div class="row">
          <div class="rate" id="cashback-rate"></div>
          <button class="btn" id="activate" type="button">Activate</button>
        </div>
        <p class="muted" id="cashback-note" hidden>Cashback links are not configured yet.</p>
      </section>

      <section class="block" id="coupon-block" hidden>
        <div class="label">
          Coupon codes
          <span class="chip" id="demo-chip" hidden>demo</span>
          <button class="mini" id="try-all" type="button" hidden>Try all</button>
        </div>
        <div id="coupons"></div>
        <p class="muted" id="coupon-empty" hidden>No codes for this store yet.</p>
        <p class="muted" id="field-note" hidden>
          No coupon field visible yet — open your cart or checkout to apply a code.
        </p>
        <form class="add-code" id="add-form">
          <input id="add-code" type="text" placeholder="Add a code you have" autocomplete="off" spellcheck="false" />
          <button class="btn ghost" type="submit">Apply</button>
        </form>
        <div class="status" id="add-status" hidden></div>
      </section>

      <section class="block" id="price-block" hidden>
        <div class="label">Price history</div>
        <div class="grid">
          <div>
            <strong id="price-low">—</strong>
            <span>90-day low</span>
          </div>
          <div>
            <strong id="price-now">—</strong>
            <span>current</span>
          </div>
        </div>
      </section>
    </div>

    <footer class="partner" id="partner-line"></footer>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
